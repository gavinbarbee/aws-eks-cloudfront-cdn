server {
    listen 8080;
    root /usr/share/nginx/html;

    # HTML changes on every release, so edges cache it briefly
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60";
    }

    # Static assets are versioned, so edges cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
